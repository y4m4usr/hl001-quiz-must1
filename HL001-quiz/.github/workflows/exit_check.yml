name: HL001 Exit Criteria Check

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'data/**'
      - 'manifest/**'
      - 'imagesnew1/**'
      - 'tools/**'
      - '.github/workflows/exit_check.yml'
  push:
    branches: [ main, develop, feat/** ]
    paths:
      - 'data/**'
      - 'manifest/**'
      - 'imagesnew1/**'
      - 'tools/**'
      - '.github/workflows/exit_check.yml'
  schedule:
    - cron: '0 18 * * *' # 03:00 JST (daily)
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    concurrency:
      group: hl001-exit-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (if any)
        run: |
          if [ -f package.json ]; then
            npm ci || npm i
          fi

      - name: Run Exit Criteria Check
        id: exitcheck
        run: |
          node tools/check_exit_criteria.js | tee exit_report.txt

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: exit-check-reports
          path: |
            exit_report.txt
            exit_report_urls.json
            exit_report_suggestions.json
