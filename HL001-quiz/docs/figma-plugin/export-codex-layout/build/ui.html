<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Codex Layout Exporter</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: #f7f7f9;
        color: #1f1f24;
      }
      body {
        margin: 0;
        padding: 16px;
        font-size: 13px;
        background: inherit;
        color: inherit;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      h2 {
        margin: 20px 0 8px;
        font-size: 13px;
      }
      .status {
        border-radius: 6px;
        padding: 10px 12px;
        margin: 0 0 12px;
        line-height: 1.5;
        border: 1px solid transparent;
      }
      .status--info {
        background: #eef4ff;
        border-color: #c2d4ff;
      }
      .status--success {
        background: #eefff4;
        border-color: #c1f4d9;
      }
      .status--error {
        background: #fff2f0;
        border-color: #ffcdc2;
        color: #c2392b;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }
      button {
        cursor: pointer;
        border: 1px solid #4d73ff;
        background: #4d73ff;
        color: #ffffff;
        border-radius: 4px;
        font-size: 12px;
        padding: 6px 10px;
        transition: background 0.2s ease, border-color 0.2s ease;
      }
      button:disabled {
        cursor: default;
        opacity: 0.6;
      }
      .command-line {
        background: rgba(77, 115, 255, 0.08);
        border: 1px dashed rgba(77, 115, 255, 0.4);
        padding: 8px 10px;
        border-radius: 4px;
        font-family: "Consolas", "SFMono-Regular", monospace;
        font-size: 12px;
        overflow-x: auto;
        margin-bottom: 8px;
      }
      button.secondary {
        background: transparent;
        color: #4d73ff;
      }
      .summary {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 12px;
        margin: 0 0 16px;
        padding: 0;
        list-style: none;
      }
      .summary li {
        display: contents;
      }
      .summary span {
        display: block;
      }
      .summary .label {
        font-weight: 600;
        color: #474752;
      }
      .assets {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 160px;
        overflow-y: auto;
        padding-right: 4px;
      }
      .asset-card {
        border: 1px solid #d4d7e5;
        border-radius: 6px;
        padding: 8px;
        background: #ffffff;
      }
      .asset-card header {
        font-weight: 600;
        margin-bottom: 4px;
        word-break: break-all;
      }
      .asset-meta {
        font-size: 11px;
        color: #585a6b;
        margin-bottom: 6px;
        line-height: 1.4;
      }
      .asset-actions {
        display: flex;
        justify-content: flex-start;
        gap: 6px;
      }
      footer {
        margin-top: 20px;
        font-size: 11px;
        color: #7a7b8c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #1a1d24;
          color: #f2f4f8;
        }
        .status--info {
          background: #1d2a44;
          border-color: #304a7c;
        }
        .status--success {
          background: #1b3326;
          border-color: #2f5c41;
        }
        .status--error {
          background: #3c1f1d;
          border-color: #6b2d28;
          color: #ffb3a8;
        }
        .summary .label {
          color: #d5d6db;
        }
        .asset-card {
          background: #242731;
          border-color: #343846;
        }
        .asset-meta {
          color: #afb3c1;
        }
        footer {
          color: #9da2b3;
        }
      }
    </style>
      <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  </head>
  <body>
    <main>
      <h1>Codex Layout Exporter</h1>
      <p id="status" class="status status--info">フレームを解析しています…</p>
      <section id="error" class="status status--error" hidden></section>
      <section id="result" hidden>
        <ul class="summary">
          <li><span class="label">レイアウト名</span><span id="layout-name">-</span></li>
          <li><span class="label">キャンバス</span><span id="canvas-size">-</span></li>
          <li><span class="label">オブジェクト数</span><span id="object-count">0</span></li>
          <li><span class="label">画像アセット</span><span id="asset-count">0</span></li>
          <li><span class="label">生成日時</span><span id="generated-at">-</span></li>
        </ul>
        <div class="actions">
          <button id="download-layout" type="button" disabled>layout.json を保存</button>
          <button id="download-bundle" type="button" disabled>Zipを保存</button>
          <button id="copy-summary" type="button" class="secondary" disabled>概要をコピー</button>
          <button id="close-plugin" type="button" class="secondary">閉じる</button>
        </div>
                <section id="sync-section" hidden>
          <h2>Codex / CloudCode 連携</h2>
          <p>Zip を保存した後は、以下の操作を実行してください。</p>
          <pre id="sync-command" class="command-line">codex ui-assets sync ./exports/layout.ui-assets.zip</pre>
          <button id="copy-command" type="button" class="secondary" disabled>操作をコピー</button>
        </section>
<h2>画像アセット</h2>
        <p id="no-assets" hidden>エクスポート対象の画像は見つかりませんでした。</p>
        <div id="asset-list" class="assets"></div>
      </section>
      <footer>選択したフレームの情報と画像を抽出し、レイアウト JSON と画像ファイルのダウンロードをサポートします。</footer>
    </main>
    <script>
      (function () {
        const state = {
          layout: null,
          assets: [],
          bundleName: ""
        };

        const statusEl = document.getElementById("status");
        const errorEl = document.getElementById("error");
        const resultSection = document.getElementById("result");
        const layoutNameEl = document.getElementById("layout-name");
        const canvasSizeEl = document.getElementById("canvas-size");
        const objectCountEl = document.getElementById("object-count");
        const assetCountEl = document.getElementById("asset-count");
        const generatedAtEl = document.getElementById("generated-at");
        const noAssetsEl = document.getElementById("no-assets");
        const assetListEl = document.getElementById("asset-list");
        const downloadLayoutBtn = document.getElementById("download-layout");
        const downloadBundleBtn = document.getElementById("download-bundle");
        const copySummaryBtn = document.getElementById("copy-summary");
        const copyCommandBtn = document.getElementById("copy-command");
        const closeBtn = document.getElementById("close-plugin");
        const syncSection = document.getElementById("sync-section");
        const syncCommandEl = document.getElementById("sync-command");

        window.addEventListener("message", (event) => {
          const message = event.data && event.data.pluginMessage;
          if (!message || !message.type) {
            return;
          }
          switch (message.type) {
            case "EXPORT_ERROR":
              showError(String(message.message || "エクスポートに失敗しました。"));
              break;
            case "EXPORT_RESULT":
              void renderExportResult(message.payload);
              break;
            default:
              break;
          }
        });

        downloadLayoutBtn.addEventListener("click", () => downloadLayout());
        downloadBundleBtn.addEventListener("click", () => downloadBundle());
        copySummaryBtn.addEventListener("click", () => copySummary());
        copyCommandBtn.addEventListener("click", () => copyCommand());
        closeBtn.addEventListener("click", () => {
          parent.postMessage({ pluginMessage: { type: "CLOSE" } }, "*");
        });
        parent.postMessage({ pluginMessage: { type: "READY" } }, "*");

        function showError(text) {
          errorEl.textContent = text;
          errorEl.hidden = false;
          resultSection.hidden = true;
          statusEl.textContent = "処理を完了できませんでした。";
          statusEl.className = "status status--error";
          downloadLayoutBtn.disabled = true;
          copySummaryBtn.disabled = true;
        }

        async function renderExportResult(payload) {
          if (!payload || !payload.layout) {
            showError("レイアウト情報を取得できませんでした。");
            return;
          }
          state.layout = payload.layout;
          state.assets = Array.isArray(payload.assets)
            ? payload.assets.map((asset) => {
                const data = base64ToUint8Array(asset.base64);
                const format = (asset.format || "PNG").toUpperCase();
                const available = Array.isArray(asset.availableFormats) && asset.availableFormats.length
                  ? asset.availableFormats.map((fmt) => String(fmt).toUpperCase())
                  : ["PNG"];
                const fileName = asset.fileName || generateDefaultFileName({
                  baseName: asset.baseName || asset.id || "asset",
                  format
                });
                return {
                  id: asset.layoutId || asset.id || fileName || "asset",
                  layoutId: asset.layoutId || asset.id || "",
                  fileName,
                  format,
                  section: asset.section || "",
                  area: asset.area || "",
                  baseName: asset.baseName || "",
                  hash: asset.hash || "",
                  autoFormatReason: asset.autoFormatReason || "",
                  availableFormats: available,
                  data,
                  originalData: cloneUint8Array(data),
                  originalFormat: format,
                  originalHash: asset.hash || ""
                };
              })
            : [];
          await appendPressedVariants();
          if (payload.preview && payload.preview.base64) {
            state.assets.unshift({
              id: payload.preview.id || "layout_preview",
              fileName: payload.preview.fileName || "layout.preview.png",
              format: payload.preview.format || "PNG",
              section: "",
              area: "",
              baseName: payload.preview.fileName || "layout_preview",
              data: base64ToUint8Array(payload.preview.base64),
              originalData: base64ToUint8Array(payload.preview.base64),
              originalFormat: (payload.preview.format || "PNG").toUpperCase(),
              originalHash: payload.preview.hash || "",
              hash: payload.preview.hash || "",
              availableFormats: ["PNG"],
              preview: true
            });
          }

          statusEl.textContent = "エクスポート結果を確認できます。";
          statusEl.className = "status status--success";
          errorEl.hidden = true;
          resultSection.hidden = false;
          downloadLayoutBtn.disabled = false;
          downloadBundleBtn.disabled = false;
          copySummaryBtn.disabled = false;
          copyCommandBtn.disabled = false;

          const meta = state.layout.meta || {};
          layoutNameEl.textContent = meta.layoutName || "-";
          const width = meta.canvasWidth != null ? Number(meta.canvasWidth) : null;
          const height = meta.canvasHeight != null ? Number(meta.canvasHeight) : null;
          canvasSizeEl.textContent = width && height ? `${round(width)} × ${round(height)}` : "-";
          objectCountEl.textContent = Array.isArray(state.layout.objects) ? String(state.layout.objects.length) : "0";
          assetCountEl.textContent = String(state.assets.length);
          generatedAtEl.textContent = meta.generatedAt || new Date().toISOString();

          const slug = slugify(meta.layoutName || "layout");
          state.bundleName = `${slug}.ui-assets.zip`;
          syncCommandEl.textContent = `codex ui-assets sync ./exports/${state.bundleName}`;
          syncSection.hidden = false;

          updateCommentSummary(meta);
          renderAssetList(state.assets);
        }

        function renderAssetList(assets) {
          assetListEl.textContent = "";
          if (!assets || assets.length === 0) {
            noAssetsEl.hidden = false;
            return;
          }
          noAssetsEl.hidden = true;
          assets.forEach((asset) => {
            const card = document.createElement("div");
            card.className = "asset-card";

            const header = document.createElement("header");
            header.textContent = asset.fileName;
            card.appendChild(header);

            const meta = document.createElement("div");
            meta.className = "asset-meta";
            meta.textContent = createMetaText(asset);
            card.appendChild(meta);

            const actions = document.createElement("div");
            actions.className = "asset-actions";
            if (!asset.preview && Array.isArray(asset.availableFormats) && asset.availableFormats.length > 0) {
              const select = document.createElement("select");
              select.title = "書き出し形式を変更";
              asset.availableFormats.forEach((format) => {
                const option = document.createElement("option");
                option.value = format;
                option.textContent = format;
                select.appendChild(option);
              });
              select.value = asset.format;
              select.addEventListener("change", (event) => {
                const value = String(event.target.value || "").toUpperCase();
                select.disabled = true;
                updateAssetFormat(asset, value)
                  .then(() => {
                    select.value = asset.format;
                    meta.textContent = createMetaText(asset);
                    showTemporaryMessage(`${asset.fileName} を ${value} に変換しました。`);
                    renderAssetList(state.assets);
                  })
                  .catch((error) => {
                    console.error("[ui] format change error", error);
                    select.value = asset.format;
                    showTemporaryMessage("変換に失敗しました。", true);
                  })
                  .finally(() => {
                    select.disabled = false;
                  });
              });
              actions.appendChild(select);
            }
            const downloadBtn = document.createElement("button");
            downloadBtn.type = "button";
            downloadBtn.textContent = "保存";
            downloadBtn.addEventListener("click", () => downloadAsset(asset));
            actions.appendChild(downloadBtn);
            card.appendChild(actions);

            assetListEl.appendChild(card);
          });
        }

        async function appendPressedVariants() {
          const variants = [];
          for (const asset of state.assets) {
            if (!shouldCreatePressedVariant(asset)) {
              continue;
            }
            try {
              const data = await generatePressedVariantBytes(asset);
              const hash = await computeSha256(data);
              variants.push({
                ...asset,
                id: `${asset.id}_dim`,
                fileName: derivePressedFileName(asset.fileName),
                data,
                originalData: cloneUint8Array(data),
                originalFormat: "PNG",
                format: "PNG",
                availableFormats: ["PNG"],
                hash,
                originalHash: hash,
                autoFormatReason: "auto-generated pressed variant",
                variantOf: asset.id
              });
            } catch (error) {
              console.warn("[ui] failed to create pressed variant:", asset.fileName, error);
            }
          }
          if (variants.length > 0) {
            state.assets.push(...variants);
          }
        }

        function shouldCreatePressedVariant(asset) {
          if (!asset || asset.preview || !(asset.data instanceof Uint8Array)) {
            return false;
          }
          const name = (asset.fileName || "").toLowerCase();
          if (!name || name.includes("_dim")) {
            return false;
          }
          const format = (asset.format || "png").toUpperCase();
          return format === "PNG";
        }

        function derivePressedFileName(fileName) {
          if (!fileName) {
            return "asset_dim.png";
          }
          const idx = fileName.lastIndexOf(".");
          if (idx === -1) {
            return `${fileName}_dim`;
          }
          const base = fileName.slice(0, idx);
          const ext = fileName.slice(idx);
          return `${base}_dim${ext}`;
        }

        async function generatePressedVariantBytes(asset) {
          const mime = guessMime(asset.format);
          const blob = new Blob([asset.data], { type: mime || "image/png" });
          const bitmap = await decodeImageBlob(blob);
          const width = bitmap && typeof bitmap.width === "number" ? bitmap.width : bitmap.naturalWidth || 0;
          const height = bitmap && typeof bitmap.height === "number" ? bitmap.height : bitmap.naturalHeight || 0;
          if (!width || !height) {
            throw new Error("Invalid bitmap dimensions");
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(bitmap, 0, 0);
          ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          const dimBlob = await new Promise((resolve, reject) => {
            canvas.toBlob((result) => {
              if (result) {
                resolve(result);
              } else {
                reject(new Error("canvas.toBlob failed"));
              }
            }, "image/png");
          });
          if (bitmap && typeof bitmap.close === "function") {
            bitmap.close();
          }
          const buffer = await dimBlob.arrayBuffer();
          return new Uint8Array(buffer);
        }

        async function decodeImageBlob(blob) {
          if (typeof createImageBitmap === "function") {
            return createImageBitmap(blob);
          }
          return new Promise((resolve, reject) => {
            const url = URL.createObjectURL(blob);
            const image = new Image();
            image.onload = () => {
              URL.revokeObjectURL(url);
              resolve(image);
            };
            image.onerror = (error) => {
              URL.revokeObjectURL(url);
              reject(error);
            };
            image.src = url;
          });
        }

        function downloadLayout() {
          if (!state.layout) {
            return;
          }
          const pretty = JSON.stringify(state.layout, null, 2);
          const blob = new Blob([pretty], { type: "application/json" });
          const name = (state.layout.meta && state.layout.meta.layoutName) || "layout";
          triggerDownload(blob, `${slugify(name)}.layout.json`);
        }

        async function downloadBundle() {
          if (!state.layout) {
            return;
          }
          if (typeof JSZip === "undefined") {
            showTemporaryMessage("Zip生成に失敗しました。", true);
            return;
          }
          const meta = state.layout.meta || {};
          const slug = slugify(meta.layoutName || "layout");
          const zip = new JSZip();
          zip.file(`${slug}.layout.json`, JSON.stringify(state.layout, null, 2));
          const folder = zip.folder("assets");
          state.assets.forEach((asset) => {
            const data = asset && asset.data ? asset.data : new Uint8Array();
            folder.file(asset.fileName, data, { binary: true });
          });
          try {
            const blob = await zip.generateAsync({
              type: "blob",
              compression: "DEFLATE",
              compressionOptions: { level: 6 }
            });
            triggerDownload(blob, state.bundleName || `${slug}.ui-assets.zip`);
            showTemporaryMessage("Zipを保存しました。");
          } catch (error) {
            console.error("[ui] bundle error", error);
            showTemporaryMessage("Zip生成に失敗しました。", true);
          }
        }

        function downloadAsset(asset) {
          if (!asset || !asset.data) {
            return;
          }
          const mime = guessMime(asset.format);
          const blob = new Blob([asset.data], { type: mime });
          triggerDownload(blob, asset.fileName);
        }

        function copySummary() {
          if (!state.layout) {
            return;
          }
          const meta = state.layout.meta || {};
          const lines = [
            `layoutName: ${meta.layoutName || "-"}` ,
            `canvas: ${meta.canvasWidth || "-"} x ${meta.canvasHeight || "-"}` ,
            `objects: ${Array.isArray(state.layout.objects) ? state.layout.objects.length : 0}` ,
            `assets: ${state.assets.length}`
          ];
          const text = lines.join("\n");
          copyText(text, "概要をコピーしました。");
        }

        function copyCommand() {
          if (!syncCommandEl || !syncCommandEl.textContent) {
            return;
          }
          copyText(syncCommandEl.textContent.trim(), "操作をコピーしました。");
        }

        function copyText(text, successMessage) {
          if (!text) {
            return;
          }
          if (!navigator.clipboard) {
            fallbackCopy(text, successMessage);
            return;
          }
          navigator.clipboard
            .writeText(text)
            .then(() => showTemporaryMessage(successMessage || "コピーしました。"))
            .catch(() => fallbackCopy(text, successMessage));
        }

        function fallbackCopy(text, successMessage) {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.appendChild(textarea);
          textarea.select();
          try {
            document.execCommand("copy");
            showTemporaryMessage(successMessage || "コピーしました。");
          } catch (_error) {
            showTemporaryMessage("コピーできませんでした。", true);
          } finally {
            document.body.removeChild(textarea);
          }
        }

        function showTemporaryMessage(text, isError) {
          statusEl.textContent = text;
          statusEl.className = "status " + (isError ? "status--error" : "status--success");
          window.setTimeout(() => {
            if (state.layout) {
              statusEl.textContent = "エクスポート結果を確認できます。";
              statusEl.className = "status status--success";
            }
          }, 2000);
        }

        function createMetaText(asset) {
          const parts = [];
          if (asset.format) {
            parts.push(`形式: ${asset.format}`);
          }
          if (asset.section) {
            parts.push(`セクション: ${asset.section}`);
          }
          if (asset.area && asset.area !== asset.section) {
            parts.push(`エリア: ${asset.area}`);
          }
          if (asset.baseName) {
            parts.push(`名称: ${asset.baseName}`);
          }
          if (asset.hash) {
            parts.push(`ハッシュ: ${formatHash(asset.hash)}`);
          }
          if (asset.autoFormatReason && !asset.preview) {
            parts.push(`理由: ${asset.autoFormatReason}`);
          }
          return parts.join(" / ") || "メタデータなし";
        }

        function triggerDownload(blob, filename) {
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = filename;
          document.body.appendChild(link);
          link.click();
          window.setTimeout(() => {
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
          }, 100);
        }

        function guessMime(format) {
          switch ((format || "").toUpperCase()) {
            case "PNG":
              return "image/png";
            case "JPG":
            case "JPEG":
              return "image/jpeg";
            case "WEBP":
              return "image/webp";
            case "SVG":
              return "image/svg+xml";
            default:
              return "application/octet-stream";
          }
        }

        // Base64文字列をUint8Arrayに変換
        function base64ToUint8Array(base64) {
          if (!base64 || typeof base64 !== "string") {
            return new Uint8Array();
          }
          try {
            const binaryString = atob(base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
              bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes;
          } catch (error) {
            console.error("[ui] Base64デコードエラー:", error);
            return new Uint8Array();
          }
        }

        async function updateAssetFormat(asset, targetFormat) {
          if (!asset || !asset.originalData) {
            return;
          }
          const normalized = (targetFormat || "").toUpperCase();
          if (!normalized) {
            throw new Error("format is empty");
          }
          const originalFormat = (asset.originalFormat || "").toUpperCase();
          if (normalized === originalFormat) {
            asset.data = cloneUint8Array(asset.originalData);
            asset.format = normalized;
            asset.fileName = generateFileNameWithFormat(asset.baseName || asset.id || "asset", normalized);
            asset.hash = asset.originalHash || asset.hash || "";
            return;
          }
          if (normalized === (asset.format || "").toUpperCase()) {
            return;
          }
          const sourceData = cloneUint8Array(asset.originalData);
          const sourceMime = guessMime(originalFormat || asset.format || "PNG");
          const blob = new Blob([sourceData], { type: sourceMime || "image/png" });
          const bitmap = await decodeImageBlob(blob);
          const width = bitmap && typeof bitmap.width === "number" ? bitmap.width : bitmap.naturalWidth || 0;
          const height = bitmap && typeof bitmap.height === "number" ? bitmap.height : bitmap.naturalHeight || 0;
          if (!width || !height) {
            throw new Error("変換対象の画像サイズが無効です");
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.clearRect(0, 0, width, height);
          ctx.drawImage(bitmap, 0, 0);
          const mime = normalized === "PNG" ? "image/png" : normalized === "WEBP" ? "image/webp" : "image/jpeg";
          const quality = normalized === "PNG" ? undefined : 0.92;
          const convertedBlob = await new Promise((resolve, reject) => {
            canvas.toBlob((result) => {
              if (result) {
                resolve(result);
              } else {
                reject(new Error("canvas.toBlob failed"));
              }
            }, mime, quality);
          });
          if (bitmap && typeof bitmap.close === "function") {
            bitmap.close();
          }
          const buffer = await convertedBlob.arrayBuffer();
          const uint8 = new Uint8Array(buffer);
          asset.data = uint8;
          asset.format = normalized;
          asset.fileName = generateFileNameWithFormat(asset.baseName || asset.id || "asset", normalized);
          asset.hash = await computeSha256(uint8);
        }

        function cloneUint8Array(data) {
          if (!(data instanceof Uint8Array)) {
            return new Uint8Array();
          }
          const clone = new Uint8Array(data.length);
          clone.set(data);
          return clone;
        }

        function generateFileNameWithFormat(baseName, format) {
          const base = slugify(baseName || "asset");
          return `${base}.${format.toLowerCase()}`;
        }

        function generateDefaultFileName(asset) {
          const base = asset && asset.baseName ? asset.baseName : asset && asset.id ? asset.id : "asset";
          const format = asset && asset.format ? asset.format : "PNG";
          return generateFileNameWithFormat(base, format);
        }

        async function computeSha256(data) {
          if (!(data instanceof Uint8Array)) {
            return "";
          }
          try {
            const digest = await crypto.subtle.digest("SHA-256", data);
            const view = new Uint8Array(digest);
            return Array.from(view).map((value) => value.toString(16).padStart(2, "0")).join("");
          } catch (error) {
            console.warn("[ui] hash calculation failed", error);
            return "";
          }
        }

        function formatHash(hash) {
          if (!hash) {
            return "-";
          }
          return hash.length > 12 ? `${hash.slice(0, 12)}…` : hash;
        }

        function updateCommentSummary(meta) {
          const summary = meta && meta.commentSummary;
          if (!summary || typeof summary.total !== "number") {
            return;
          }
          const summaryList = resultSection.querySelector(".summary");
          if (!summaryList) {
            return;
          }
          let existing = summaryList.querySelector('[data-summary="comments"]');
          if (!existing) {
            const labelItem = document.createElement("li");
            const valueItem = document.createElement("li");
            labelItem.dataset.summary = "comments";
            const labelSpan = document.createElement("span");
            labelSpan.className = "label";
            labelSpan.textContent = "コメント";
            const valueSpan = document.createElement("span");
            valueSpan.id = "comment-summary";
            labelItem.appendChild(labelSpan);
            valueItem.appendChild(valueSpan);
            summaryList.appendChild(labelItem);
            summaryList.appendChild(valueItem);
            existing = labelItem;
          }
          const value = resultSection.querySelector("#comment-summary");
          if (value) {
            value.textContent = `${summary.total} 件 / ノード ${summary.nodeCount}`;
          }
        }

        function slugify(value) {
          if (!value) {
            return "export";
          }
          return String(value)
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "_")
            .replace(/^_+|_+$/g, "") || "export";
        }

        function round(value) {
          return Math.round(Number(value) * 10) / 10;
        }
      })();
    </script>
  </body>
</html>
